
name: PlatonVPN - Open Source Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install native build tools
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build open-source debug APK
        env:
          OVERRIDE_VERSION_NAME: "1.0.0.0"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            assembleProductionVanillaOpenSourceDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlatonVPN-open-source-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
